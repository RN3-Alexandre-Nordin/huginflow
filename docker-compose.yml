services:
  app:
    container_name: ragnar-app
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Defina RAGNAR_ENV no .env do host (development | production). Padrão: development.
      - RAGNAR_ENV=${RAGNAR_ENV:-development}
