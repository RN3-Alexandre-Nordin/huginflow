services:
  app:
    container_name: huginflow-app
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Preferir HUGINFLOW_ENV; HUGINFLOW_ENV ainda lido pelo código como legado.
      - HUGINFLOW_ENV=${HUGINFLOW_ENV:-${HUGINFLOW_ENV:-development}}
      - HUGINFLOW_ENV=${HUGINFLOW_ENV:-${HUGINFLOW_ENV:-development}}
