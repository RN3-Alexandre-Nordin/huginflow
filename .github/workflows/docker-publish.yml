name: Docker Image CI/CD (GHCR)

on:
  push:
    branches:
      - main      # deploy produção
      - develop   # deploy dev (opcional)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Definir imagem GHCR (lowercase)
        id: ghcr
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir ambiente (prod vs dev)
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ragnar_env=production" >> $GITHUB_OUTPUT
            echo "app_url=https://app.ragnar.ia.br" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "ragnar_env=development" >> $GITHUB_OUTPUT
            echo "app_url=https://dev-ragnar.rn3.tec.br" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ghcr.outputs.image }}
          tags: |
            type=raw,value=${{ steps.env.outputs.tag }}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ steps.env.outputs.app_url }}
            NEXT_PUBLIC_LANDING_PAGE_TOKEN=${{ secrets.NEXT_PUBLIC_LANDING_PAGE_TOKEN }}

  deploy-prod:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Definir imagem GHCR (lowercase)
        id: ghcr
        run: echo "image=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Verificar secrets de deploy na VPS
        id: deploy_ready
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::warning::Deploy SSH ignorado — faltam secrets VPS_HOST, VPS_USER ou VPS_SSH_KEY."
            echo "Ver docs/deploy-vps-github-actions.md"
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Validar chave SSH do CI
        if: steps.deploy_ready.outputs.ready == 'true'
        run: |
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ssh-keygen -y -f "$KEY_FILE" -P "" >/dev/null 2>&1; then
            echo "Chave SSH OK (sem passphrase — padrão ragnar_deploy)."
          elif [ -n "$VPS_SSH_PASSPHRASE" ]; then
            if ssh-keygen -y -f "$KEY_FILE" -P "$VPS_SSH_PASSPHRASE" >/dev/null 2>&1; then
              echo "::warning::Chave com passphrase detectada. Recomendado: ragnar_deploy sem senha (docs/deploy-vps-github-actions.md)."
            else
              echo "::error::VPS_SSH_PASSPHRASE incorreta para VPS_SSH_KEY."
              exit 1
            fi
          else
            echo "::error::VPS_SSH_KEY está protegida por passphrase."
            echo "Solução: crie chave ragnar_deploy sem senha e atualize VPS_SSH_KEY. Ver docs/deploy-vps-github-actions.md"
            exit 1
          fi
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}

      - name: Deploy Swarm na VPS de produção
        if: steps.deploy_ready.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            IMAGE="${{ steps.ghcr.outputs.image }}:latest"
            SERVICE="ragnar-app_app"
            docker pull "$IMAGE"
            docker service update \
              --image "$IMAGE" \
              --env-add RAGNAR_ENV=production \
              --env-add WHATSAPP_API_URL=https://evo.rn3.tec.br \
              --env-add WHATSAPP_API_URL_PROD=https://evo.rn3.tec.br \
              --env-add RAGNAR_WEBHOOK_URL=https://app.ragnar.ia.br/api/webhooks/evolution \
              --env-add RAGNAR_WEBHOOK_URL_PROD=https://app.ragnar.ia.br/api/webhooks/evolution \
              "$SERVICE"
            docker service ps "$SERVICE" --no-trunc
            docker image prune -f
