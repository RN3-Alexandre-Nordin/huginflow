name: Docker Image CI/CD (GHCR)

on:
  push:
    branches:
      - main      # deploy produção
      - develop   # deploy dev (opcional)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir ambiente (prod vs dev)
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ragnar_env=production" >> $GITHUB_OUTPUT
            echo "app_url=https://ragnar.rn3.tec.br" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "ragnar_env=development" >> $GITHUB_OUTPUT
            echo "app_url=https://dev-ragnar.rn3.tec.br" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.env.outputs.tag }}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ steps.env.outputs.app_url }}
            NEXT_PUBLIC_LANDING_PAGE_TOKEN=${{ secrets.NEXT_PUBLIC_LANDING_PAGE_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

      # Deploy automático só em produção (branch main). Dev roda localmente.
      - name: Verificar secrets de deploy na VPS
        if: github.ref == 'refs/heads/main'
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "::error::Secret VPS_HOST não configurado"; missing=1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "::error::Secret VPS_USER não configurado"; missing=1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "::error::Secret VPS_SSH_KEY não configurado"; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Configure em: Settings → Secrets and variables → Actions"
            echo "  VPS_HOST     = IP ou hostname da VPS (ex: 123.45.67.89)"
            echo "  VPS_USER     = usuário SSH (ex: root ou deploy)"
            echo "  VPS_SSH_KEY  = chave privada OpenSSH completa (incluindo BEGIN/END)"
            exit 1
          fi

      - name: Deploy na VPS de produção
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            cd /opt/ragnar
            docker pull ghcr.io/${{ github.repository }}:latest
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps app
            docker image prune -f