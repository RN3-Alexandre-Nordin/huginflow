# Deploy de PRODUÇÃO na VPS — Hugin Flow
# Hosts: app.huginflow.com (cockpit) + huginflow.com / www (landing)
#
# Dev local: npm run dev + .env.local (não use este compose).
#
# Na VPS / Portainer: imagem ghcr.io/rn3-alexandre-nordin/huginflow:latest
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    image: ghcr.io/rn3-alexandre-nordin/huginflow:latest
    restart: unless-stopped
    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - HUGINFLOW_ENV=${HUGINFLOW_ENV:-production}
      - HUGINFLOW_ENV=${HUGINFLOW_ENV:-production}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://app.huginflow.com}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://huginflow.com}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WHATSAPP_API_URL_PROD=${WHATSAPP_API_URL_PROD}
      - WHATSAPP_API_TOKEN_PROD=${WHATSAPP_API_TOKEN_PROD}
      - HUGINFLOW_WEBHOOK_URL_PROD=${HUGINFLOW_WEBHOOK_URL_PROD}
      - HUGINFLOW_WEBHOOK_URL_PROD=${HUGINFLOW_WEBHOOK_URL_PROD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

    labels:
      - traefik.enable=true
      - traefik.http.routers.huginflow-app.rule=Host(`app.huginflow.com`)
      - traefik.http.routers.huginflow-app.entrypoints=websecure
      - traefik.http.routers.huginflow-app.tls.certresolver=letsencryptresolver
      - traefik.http.routers.huginflow-app.service=huginflow
      - traefik.http.services.huginflow.loadbalancer.server.port=3000

    networks:
      - rn3net

networks:
  rn3net:
    external: true
    name: rn3net
